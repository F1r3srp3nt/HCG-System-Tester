name: macOS build & test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build package (debug)
        id: build
        run: swift build 2>&1 | tee build.log

      - name: Summarise compiler errors
        if: failure()
        run: grep -E "error:" build.log | sed -E 's#^.*/HCG-System-Tester/##' | sort -u | head -n 120

      - name: Test package
        run: swift test 2>&1 | tee test.log

      - name: Summarise test failures
        if: failure()
        run: grep -E "error:|failed|XCTAssert" test.log | sed -E 's#^.*/HCG-System-Tester/##' | sort -u | head -n 120

      - name: Probe real hardware of the runner (read-only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          swift run hcg-probe --toolchain
          swift run hcg-probe --synthetic --apple --pair
          swift run hcg-probe --apple
          swift run hcg-probe
          swift run hcg-probe --json > probe.json && head -c 2000 probe.json
          swift run hcg-probe --connectivity --ssdp

      - name: Diagnose synthetic fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: swift run hcg-probe --synthetic --diagnose

      - name: Build release app bundle (unsigned check)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ -x scripts/build-app.sh ]; then scripts/build-app.sh --configuration release --no-sign; fi

      - name: Render UI snapshots (synthetic fixtures, read-only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          APP_BIN="dist/HCG System Tester.app/Contents/MacOS/HCGSystemTester"
          if [ ! -x "$APP_BIN" ]; then echo "app bundle not built"; exit 0; fi
          mkdir -p snapshots
          "$APP_BIN" --hcg-snapshot "$PWD/snapshots" > snapshots/app.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la snapshots
          cat snapshots/devices.tsv 2>/dev/null || true
          tail -n 40 snapshots/app.log || true

      - name: Upload UI snapshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots/
          retention-days: 5
          if-no-files-found: ignore

      - name: Build Xcode project
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ -d App/HCGSystemTester.xcodeproj ]; then
            xcodebuild -project App/HCGSystemTester.xcodeproj -scheme HCGSystemTester -configuration Debug \
              -destination 'platform=macOS' -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] || exit "$status"
            APP="build/xcode/Build/Products/Debug/HCG System Tester.app"
            echo "== App icon verification =="
            /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
            ls -la "$APP/Contents/Resources/"
            test -f "$APP/Contents/Resources/Assets.car"
            test -f "$APP/Contents/Resources/AppIcon.icns" && echo "AppIcon.icns present in Xcode-built bundle"
            test -f "dist/HCG System Tester.app/Contents/Resources/AppIcon.icns" && echo "AppIcon.icns present in build-app.sh bundle"
          fi
